name: Refresh contribution artwork
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: read
concurrency:
  group: contribution-artwork
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'theshindesahil/theshindesahil'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch real public contributions and render consuming snake
        run: python3 scripts/contribution_art.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Prepare artwork only
        run: |
          mkdir -p _site/assets
          cp assets/github-snake-*.svg assets/contributions-*-static.svg _site/assets/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed artwork
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
